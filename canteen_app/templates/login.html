{% extends 'base.html' %}
{% block title %}Student Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="section-title mb-4">Student Login</h2>
    <div class="auth-card">
      <form method="post">
        <div class="mb-3">
          <label class="form-label">Your Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" class="form-control" pattern="[0-9]{10,15}" required>
        </div>
        <button type="submit" class="btn btn-primary">Continue</button>
      </form>
      <p class="muted-note mt-3 mb-0">No password needed — just enter your name and phone number every time you order.</p>
    </div>
  </div>
</div>
{% endblock %}
